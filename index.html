<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food Donation System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary {
            background: #fff;
            color: #764ba2;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: #f0f0f0;
        }
        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
        }
        .btn-admin {
            background: #1a73e8;
            color: white;
            border: 2px solid #1a73e8;
        }
        .btn-admin:hover {
            background: #1557b0;
            border-color: #1557b0;
            transform: translateY(-3px);
        }
        .status-link {
            margin-top: 2rem;
            display: block;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .status-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Food Donation System</h1>
        <p>Connecting surplus food with those who need it most. Join our community to make a difference today.</p>
        
        <div class="btn-group">
            <a href="login.jsp" class="btn btn-primary">User Login</a>
            <a href="register.jsp" class="btn btn-secondary">Register</a>
            <a href="admin-login.jsp" class="btn btn-admin">Admin Login</a>
        </div>

        <a href="testdb" class="status-link">🔍 Check System Database Status</a>
    </div>
</body>
</html>
